name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: fmt
        run: test -z "$(gofmt -l .)"
      - name: test
        run: go test ./...
      - name: examples
        run: go build ./examples/...
      - name: inventory
        run: go test ./tools/syncpint
